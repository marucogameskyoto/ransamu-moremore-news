name: Update digest and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3,6,9,12,15,23 * * *" # 08:23, 12:23, 15:23, 18:23, 21:23, 00:23 JST
    - cron: "43 3,6,9,12,15,23 * * *" # Retry at :43 JST if the scheduled refresh has not succeeded if needed

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  schedule-guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Skip retry if this window already completed successfully
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/update-and-publish.yml/runs?event=schedule&per_page=100")" || {
              echo "Could not inspect recent scheduled runs; proceeding with refresh."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
          RUNS_JSON="$runs_json" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          current_id = int(os.environ["GITHUB_RUN_ID"])
          now = datetime.now(timezone.utc)
          hour_start = now.replace(minute=0, second=0, microsecond=0)
          runs = json.loads(os.environ["RUNS_JSON"]).get("workflow_runs", [])
          succeeded = any(
              int(run["id"]) != current_id
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and datetime.fromisoformat(run["created_at"].replace("Z", "+00:00")) >= hour_start
              for run in runs
          )
          should_run = "false" if succeeded else "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={should_run}\n")
          print("A scheduled refresh already succeeded in this UTC hour; skipping." if succeeded else "No successful scheduled refresh this UTC hour; proceeding.")

          PY

  update-and-publish:
    needs: schedule-guard
    if: ${{ needs.schedule-guard.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect official-feed headlines
        run: python scripts/update_feed.py
      - name: Crawl allowlisted official disclosure pages
        run: python scripts/crawl_official_sites.py
      - name: Discover leads and verify official disclosures
        run: python scripts/discover_roundup_official_links.py
      - name: Persist collected incident records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/incidents.json
          if git diff --cached --quiet; then
            echo "No incident data changes to persist."
          else
            git commit -m "Update official incident digest"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
