name: Update digest and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 22,3,9,14 * * *" # 07:00, 12:00, 18:00, 23:00 JST daily

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect official-feed headlines
        run: python scripts/update_feed.py
      - name: Crawl allowlisted official disclosure pages
        run: python scripts/crawl_official_sites.py
      - name: Discover leads and verify official disclosures
        run: python scripts/discover_roundup_official_links.py
      - name: Persist collected incident records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/incidents.json
          if git diff --cached --quiet; then
            echo "No incident data changes to persist."
          else
            git commit -m "Update official incident digest"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

